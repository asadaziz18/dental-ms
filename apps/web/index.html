<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D9488" />
    <title>Dental MS</title>
    <style>
      @media print {
        .no-print { display: none !important; }
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        /*
         * Prescription print: PrescriptionPad adds body.print-prescription-only before window.print().
         * Without that class, hiding everything would blank normal prints (e.g. Today's Schedule).
         */
        body.print-prescription-only * { visibility: hidden; }
        body.print-prescription-only .prescription-print-view,
        body.print-prescription-only .prescription-print-view * { visibility: visible; }
        body.print-prescription-only .prescription-print-view {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        body.print-today-schedule-only * {
          visibility: hidden;
        }
        body.print-today-schedule-only .today-schedule-print-view,
        body.print-today-schedule-only .today-schedule-print-view * {
          visibility: visible;
        }
        body.print-today-schedule-only .today-schedule-print-view {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
