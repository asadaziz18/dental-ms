<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D9488" />
    <title>Dental MS</title>
    <style>
      @media print {
        .no-print { display: none !important; }
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        /* When printing a prescription, hide app shell and show only the prescription slip */
        body * { visibility: hidden; }
        .prescription-print-view, .prescription-print-view * { visibility: visible; }
        .prescription-print-view { position: absolute; left: 0; top: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
